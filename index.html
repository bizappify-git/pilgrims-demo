<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilgrim's Catch & Eat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Bangers&display=swap" rel="stylesheet">
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="hud" class="hidden">
  <div class="pill">SCORE <span id="score">0</span></div>
  <div class="pill timer">⏱ <span id="time">30</span></div>
</div>

<div id="startScreen" class="overlay">
  <h1>PILGRIM'S</h1>
  <h2>CATCH &amp; EAT</h2>
  <p>Toca los nuggets con tu mano para atraparlos.<br>¡Atrapa todos los que puedas!</p>
  <button id="startBtn">¡JUGAR!</button>
  <small id="status"></small>
</div>

<div id="gameOver" class="overlay hidden">
  <h1>¡TIEMPO!</h1>
  <p class="big">Puntaje final</p>
  <div id="finalScore">0</div>
  <button id="restartBtn">JUGAR DE NUEVO</button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
